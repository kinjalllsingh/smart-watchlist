<!DOCTYPE html>
<html>
<head>
    <title>Watchlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <header class="top">
            <div class="title-row">
                <h1>Watchlist</h1>
                <span class="live"><span class="dot"></span>LIVE</span>
            </div>
            <p class="subtitle">Tracking what changed, not just what's current</p>
        </header>

        <div class="add-form">
            <input type="text" id="symbol-input" placeholder="Add a symbol, e.g. TCS">
            <button onclick="addStock()">Add</button>
        </div>

        <div id="watchlist"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
